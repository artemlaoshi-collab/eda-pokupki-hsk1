.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#3c0a0af2,#501010bd 60%,#50101050)}
.hi{position:relative;max-width:980px;margin:0 auto;padding:44px 20px;display:grid;grid-template-columns:1.3fr .7fr;gap:24px;align-items:center}
.hero h1{margin:0;font:400 clamp(54px,11vw,104px)/1 "Ma Shan Zheng","Kaiti SC",KaiTi,serif;color:#f3c06a;white-space:nowrap}
.hero h2{font:400 clamp(21px,3.4vw,28px)/1.25 Prata,Georgia,serif;margin:8px 0 8px}.hero p{margin:0;max-width:44ch;color:#f6dccb}
.pol{background:#fbf3ea;padding:8px 8px 30px;box-shadow:0 14px 30px #0006;position:relative;transform:rotate(5deg);max-width:200px;justify-self:center;color:#5b1614;font:400 18px/1 "Ma Shan Zheng",serif;text-align:center}
.pol img{width:100%;aspect-ratio:1;object-fit:cover}.pol i{position:absolute;bottom:8px;left:0;right:0;font-style:normal}
main{max-width:980px;margin:0 auto;padding:26px 20px 30px}
.ctl{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.ctl label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mu)}
.ctl select{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:16px}
.ctl input[type=range]{accent-color:var(--red);width:150px}.ctl b{color:var(--red)}
.btn{border:0;border-radius:999px;padding:10px 22px;font-weight:600;background:var(--red);color:#ffecd0}
.st{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0 0 14px;font-weight:600}.st span b{color:var(--red)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.mt button{min-height:60px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:18px;line-height:1.3}
.mt .h{font:400 34px/1.2 "Noto Serif SC","Songti SC",SimSun,serif}.mt .r small{display:block;color:var(--mu);font-size:14px}.mt .r .p{font:600 20px "Noto Serif SC",serif;color:var(--per)}
.mt button.sel{border-color:var(--gold);background:#e3a94533}
.mt button.ok{border-color:var(--jade);background:var(--js);opacity:.6;cursor:default}
.mt button.bad{border-color:var(--err);background:var(--es);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sh{display:flex;gap:14px;align-items:center;margin:0 0 14px}.no{width:50px;height:50px;flex:none;display:grid;place-items:center;font:400 28px/1 "Ma Shan Zheng",serif;background:var(--red);color:#ffecd0;border-radius:6px}.sh h2{margin:0;font:400 clamp(20px,4vw,28px)/1.2 Prata,Georgia,serif}.sh .z{color:var(--per);font-size:.95rem;font-family:"Noto Serif SC",serif}
.sec2{margin-top:64px;padding-top:44px;border-top:1px solid var(--line)}.tr{padding:14px 0;border-bottom:1px dashed var(--line)}.tr:last-child{border:0}.tr textarea{width:100%;min-height:68px;margin-top:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);font:20px/1.6 "Noto Serif SC",serif;resize:vertical}.tr b{color:var(--per);margin-right:6px}
.win{display:none;text-align:center;margin:20px 0 0;padding:18px;border:2px dashed var(--red);border-radius:12px;font:400 22px Prata,Georgia,serif}.win.on{display:block}.win small{display:block;font:400 15px "Golos Text";color:var(--mu);margin-top:4px}
.pol.m{max-width:170px;margin:34px 0 0 auto;transform:rotate(-4deg)}
.brand{text-align:center;padding:14px 0 48px}.brand i{display:block;margin-bottom:8px;font:400 34px/1 "Ma Shan Zheng","Kaiti SC",KaiTi,serif;color:var(--red);font-style:normal}.brand span{display:inline-block;border:2px solid var(--red);color:var(--red);border-radius:999px;padding:8px 26px;font:400 20px/1.2 Prata,Georgia,serif;letter-spacing:.04em}
@media(max-width:700px){.hi{grid-template-columns:1fr}.hero .pol{display:none}.mt .h{font-size:28px}.mt button{font-size:16px}}
@media(prefers-reduced-motion:reduce){.mt button.bad{animation:none}}

const ST={f:'吃 吃饭 要 面包 米饭 面条 碗 喝 水 茶 咖啡 好吃 好喝 菜 中国菜 牛奶 啤酒',r:'苹果 草莓 香蕉 水果 梨 西瓜 葡萄',b:'多少钱 两块钱 东西 衣服 电脑 斤 块 再 给 便宜 太…了 种',m:'碗 本 杯 瓶 块 口 袋 杯子 袋子 瓶子 本子 斤 种'};

let sel=null,found=0,err=0,tot=0;
function pool(){const s=$('#set').value;return s=='all'?AW:ST[s].split(' ').map(h=>AW.find(w=>w[0]==h))}
function fill(){const m=$('#mode').value;const w=sh(pool());const k=Math.min(+$('#n').value,w.length);const ids=w.slice(0,k);
 const L=ids.map(x=>`<button class="h" style="${x[0].length>4?'font-size:21px':''}" data-i="${x[0]}" data-p="${x[1]}" aria-label="${x[0]}">${x[0]}</button>`),R=sh(ids).map(x=>`<button class="r" data-i="${x[0]}" data-p="${x[1]}">${m=='ru'?x[2]:m=='py'?`<span class="p">${x[1]}</span>`:`<span class="p">${x[1]}</span><small>${x[2]}</small>`}</button>`);
 $('#mt').innerHTML=L.map((l,i)=>l+R[i]).join('');sel=null;found=0;err=0;tot=k;upd();$('#win').classList.remove('on')}
function upd(){$('#f').textContent=found;$('#t').textContent=tot;$('#e').textContent=err}
$('#mt').onclick=e=>{const b=e.target.closest('button');if(!b||b.classList.contains('ok'))return;
 if(!sel||sel.className.split(' ')[0]==b.className.split(' ')[0]){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
 if(sel.dataset.i==b.dataset.i||($('#mode').value=='py'&&sel.dataset.p==b.dataset.p)){sel.classList.remove('sel');sel.classList.add('ok');b.classList.add('ok');sel=null;found++;upd();
